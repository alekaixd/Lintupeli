<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<link rel="stylesheet" href="style.css" />
	<title>Document</title>
	<script src="game.js" defer></script>
	<script src="soundeffects.js" defer></script>
</head>

<body>
	<div id="header">
		<header>
			<h1>Bird Game <img src="bird_logo.png" alt="logo"></h1>
			<nav>
				<ul>
					<li>
						<p id="username">User: </p>
					</li>
					<li><button id="infoBtn">Game Info</button></li>
					<li><button id="audioToggleBtn">Mute Audio</button></li>
					<li><button id="exit" onclick="logout()">Exit→</button></li>
				</ul>
			</nav>
		</header>
		<div id="header_line"></div>
		<div id="main_content">
			<div id="map"></div>
			<div id="control_panel">
				<div id="statsInfo">
					<h2>Stats info:</h2>
					<h3 id="mult">Multiplier: 2.0x</h3>
					<p id="score">Total Score: 0</p>
					<p id="energy">Energy: 50/50</p>
					<p id="actions">Actions left: 3/3</p>
					<p></p>
				</div>
				<div id="allBtn">
					<button id="flyBtn">Fly</button>
					<button id="eatBtn">Eat</button>
					<button id="sleepBtn">Sleep</button>
					<button id="chripBtn">Chirp</button>
				</div>
				<div id="flyOptions" class="hidden"></div>
				<div id="messageContainer" class="message hidden"></div>
				<div id="infoOverlay" class="hidden info-overlay">
					<div class="info-box">
						<h2 id="infoTitle">Information</h2>
						<p id="infoText">
							Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus
							lacinia odio vitae vestibulum vestibulum. Cras venenatis euismod
							malesuada.
						</p>
						<button id="closeInfoBtn">Close</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
